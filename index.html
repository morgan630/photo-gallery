<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Photo Booth</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f5;
            color: #18181b;
            min-height: 100vh;
        }

        .hero {
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                #111111;

            color: white;
            padding: 45px 20px 55px;
            text-align: center;
        }

        .small-title {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 15px;
            color: #d4d4d8;
            line-height: 1.6;
            max-width: 420px;
            margin: auto;
        }

        .container {
            max-width: 850px;
            margin: -30px auto 40px;
            padding: 0 16px;
        }

        .camera-card {
            background: white;
            border-radius: 22px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .camera-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            background: #f1f1f1;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        .camera-card h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .camera-card p {
            color: #71717a;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .camera-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 400px;

            margin: auto;
            padding: 18px 25px;

            background: #111111;
            color: white;

            border-radius: 14px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .camera-button:hover {
            background: #333333;
            transform: translateY(-2px);
        }

        .camera-button:active {
            transform: scale(0.98);
        }

        input[type="file"] {
            display: none;
        }

        #status {
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 35px 5px 15px;
        }

        .gallery-header h2 {
            font-size: 22px;
        }

        .gallery-header span {
            font-size: 13px;
            color: #71717a;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .photo {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;

            border-radius: 12px;
            background: #e4e4e7;

            transition: 0.2s;
        }

        .photo:hover {
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            color: #a1a1aa;
            font-size: 12px;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .hero {
                padding: 38px 20px 50px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .camera-card {
                padding: 28px 18px;
            }

            #gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 7px;
            }

            .photo {
                border-radius: 10px;
            }
        }
    </style>
</head>


<body>


    <!-- HEADER -->

    <section class="hero">

        <div class="small-title">
            Welcome
        </div>

        <h1>
            Event Photo Booth
        </h1>

        <p>
            Capture the moment, share the memory,
            and see everyone's photos in one place.
        </p>

    </section>


    <!-- MAIN -->

    <main class="container">


        <!-- CAMERA -->

        <div class="camera-card">

            <div class="camera-icon">
                📸
            </div>

            <h2>
                Capture Your Moment
            </h2>

            <p>
                Take a photo and share it
                with everyone at the event.
            </p>

            <label
                class="camera-button"
                for="photoInput"
            >
                📷 &nbsp; TAKE A PHOTO
            </label>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
                capture="environment"
            >

            <div id="status"></div>

        </div>


        <!-- GALLERY -->

        <div class="gallery-header">

            <h2>
                Event Gallery
            </h2>

            <span id="photoCount">
                Loading...
            </span>

        </div>

        <div id="gallery"></div>

    </main>


    <footer>
        Made for unforgettable moments ✨
    </footer>


    <script>

        /* =========================
           CLOUDINARY SETTINGS
        ========================= */

        const CLOUD_NAME = "aiv9r6zk";

        const UPLOAD_PRESET = "event photo";

        const GALLERY_TAG = "event_gallery";


        /* =========================
           PAGE ELEMENTS
        ========================= */

        const photoInput =
            document.getElementById("photoInput");

        const gallery =
            document.getElementById("gallery");

        const status =
            document.getElementById("status");

        const photoCount =
            document.getElementById("photoCount");


        let uploadedPhotos = 0;


        /* =========================
           PHOTO SELECTION
        ========================= */

        photoInput.addEventListener(
            "change",
            async function () {

                const file = this.files[0];

                if (!file) {
                    return;
                }

                try {

                    /*
                     * STEP 1:
                     * COMPRESS PHOTO
                     */

                    status.textContent =
                        "Preparing photo...";


                    const compressedFile =
                        await compressImage(file);


                    /*
                     * STEP 2:
                     * UPLOAD TO CLOUDINARY
                     */

                    status.textContent =
                        "Uploading photo...";


                    const formData =
                        new FormData();


                    formData.append(
                        "file",
                        compressedFile
                    );


                    formData.append(
                        "upload_preset",
                        UPLOAD_PRESET
                    );


                    formData.append(
                        "tags",
                        GALLERY_TAG
                    );


                    const uploadUrl =
                        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;


                    const response =
                        await fetch(
                            uploadUrl,
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    console.log(
                        "Cloudinary upload:",
                        data
                    );


                    /*
                     * STEP 3:
                     * CHECK RESULT
                     */

                    if (data.secure_url) {

                        /*
                         * Show photo immediately
                         */

                        addPhoto(
                            data.secure_url
                        );


                        uploadedPhotos++;


                        photoCount.textContent =
                            uploadedPhotos +
                            (
                                uploadedPhotos === 1
                                    ? " Photo"
                                    : " Photos"
                            );


                        status.textContent =
                            "✓ Photo uploaded successfully!";


                    } else {

                        console.error(
                            "Cloudinary error:",
                            data
                        );


                        status.textContent =
                            "❌ Unable to upload the photo.";

                    }


                } catch (error) {

                    console.error(
                        "Upload error:",
                        error
                    );


                    status.textContent =
                        "❌ Upload failed. Please try again.";

                }


                /*
                 * Allow another photo
                 */

                photoInput.value = "";

            }
        );


        /* =========================
           COMPRESS PHOTO
        ========================= */

        function compressImage(file) {

            return new Promise(
                function (resolve, reject) {

                    const img =
                        new Image();

                    const reader =
                        new FileReader();


                    reader.onload =
                        function (event) {

                            img.onload =
                                function () {

                                    const maxWidth = 1600;
                                    const maxHeight = 1600;

                                    let width =
                                        img.width;

                                    let height =
                                        img.height;


                                    /*
                                     * Resize width
                                     */

                                    if (
                                        width >
                                        maxWidth
                                    ) {

                                        height =
                                            height *
                                            (
                                                maxWidth /
                                                width
                                            );

                                        width =
                                            maxWidth;
                                    }


                                    /*
                                     * Resize height
                                     */

                                    if (
                                        height >
                                        maxHeight
                                    ) {

                                        width =
                                            width *
                                            (
                                                maxHeight /
                                                height
                                            );

                                        height =
                                            maxHeight;
                                    }


                                    /*
                                     * Canvas
                                     */

                                    const canvas =
                                        document.createElement(
                                            "canvas"
                                        );


                                    canvas.width =
                                        width;

                                    canvas.height =
                                        height;


                                    const ctx =
                                        canvas.getContext(
                                            "2d"
                                        );


                                    ctx.drawImage(
                                        img,
                                        0,
                                        0,
                                        width,
                                        height
                                    );


                                    /*
                                     * Convert to JPEG
                                     */

                                    canvas.toBlob(
                                        function (blob) {

                                            if (!blob) {

                                                reject(
                                                    new Error(
                                                        "Compression failed"
                                                    )
                                                );

                                                return;
                                            }


                                            const compressedFile =
                                                new File(
                                                    [blob],
                                                    "event-photo.jpg",
                                                    {
                                                        type:
                                                            "image/jpeg"
                                                    }
                                                );


                                            resolve(
                                                compressedFile
                                            );

                                        },
                                        "image/jpeg",
                                        0.80
                                    );

                                };


                            img.onerror =
                                function () {

                                    reject(
                                        new Error(
                                            "Unable to read image"
                                        )
                                    );

                                };


                            img.src =
                                event.target.result;

                        };


                    reader.onerror =
                        function () {

                            reject(
                                new Error(
                                    "Unable to read file"
                                )
                            );

                        };


                    reader.readAsDataURL(file);

                }
            );

        }


        /* =========================
           DISPLAY PHOTO
        ========================= */

        function addPhoto(url) {

            const image =
                document.createElement("img");


            image.src =
                url;


            image.className =
                "photo";


            image.loading =
                "lazy";


            image.alt =
                "event photo";


            gallery.prepend(
                image
            );

        }


        /* =========================
           LOAD SAVED PHOTOS
        ========================= */

        async function loadGallery() {

            try {

                photoCount.textContent =
                    "Loading...";


                /*
                 * Cloudinary Resource List
                 */

                const listUrl =
                    `https://res.cloudinary.com/${CLOUD_NAME}/image/list/tag/${GALLERY_TAG}.json`;


                const response =
                    await fetch(listUrl);


                if (!response.ok) {

                    throw new Error(
                        "Cloudinary gallery request failed"
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "Saved gallery:",
                    data
                );


                gallery.innerHTML =
                    "";


                if (
                    data.resources &&
                    data.resources.length > 0
                ) {


                    /*
                     * Newest photos first
                     */

                    const photos =
                        [...data.resources].reverse();


                    photos.forEach(
                        function (photo) {


                            /*
                             * Build Cloudinary URL
                             */

                            const extension =
                                photo.format
                                    ? "." + photo.format
                                    : "";


                            const photoUrl =
                                `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${photo.public_id}${extension}`;


                            addPhoto(
                                photoUrl
                            );

                        }
                    );


                    uploadedPhotos =
                        photos.length;


                    photoCount.textContent =
                        uploadedPhotos +
                        (
                            uploadedPhotos === 1
                                ? " Photo"
                                : " Photos"
                        );


                } else {

                    photoCount.textContent =
                        "No photos yet";

                }


            } catch (error) {

                console.error(
                    "Gallery error:",
                    error
                );


                photoCount.textContent =
                    "Gallery unavailable";

            }

        }


        /* =========================
           START
        ========================= */

        loadGallery();

    </script>

</body>

</html>
