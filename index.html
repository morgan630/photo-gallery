<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        .upload-button {
            display: inline-block;
            padding: 15px 25px;
            background: #222;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            margin: 20px 0;
        }

        input[type="file"] {
            display: none;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 20px auto;
        }

        #gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        #status {
            margin: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>📸 Event Photo Gallery</h1>

    <p>Take a photo and upload it to the gallery.</p>

    <label class="upload-button" for="photoInput">
        📷 Take Photo
    </label>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        capture="camera"
    >

    <div id="status"></div>

    <div id="gallery"></div>

    <script>

        // YOUR CLOUDINARY INFORMATION
        const CLOUD_NAME = "aiv9r6zk";
        const UPLOAD_PRESET = "Event Photo";

        const photoInput = document.getElementById("photoInput");
        const gallery = document.getElementById("gallery");
        const status = document.getElementById("status");

        photoInput.addEventListener("change", async function () {

            const file = this.files[0];

            if (!file) {
                return;
            }

            status.textContent = "Uploading photo...";

            const formData = new FormData();

            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);

            try {

                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await response.json();

                if (data.secure_url) {

                    const image = document.createElement("img");

                    image.src = data.secure_url;

                    gallery.prepend(image);

                    status.textContent = "✅ Photo uploaded successfully!";

                } else {

                    status.textContent = "❌ Upload failed.";

                    console.log(data);
                }

            } catch (error) {

                console.error(error);

                status.textContent = "❌ Something went wrong.";

            }

        });

    </script>

</body>
</html>
