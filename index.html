<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Photo</title>

    <script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #cccccc;
            margin-bottom: 30px;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 18px 35px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #cameraButton {
            background: white;
            color: black;
        }

        #status {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📸 Event Photos</h1>

    <p>
        Take a photo and share it with us!
    </p>

    <button id="cameraButton">
        📷 TAKE PHOTO
    </button>

    <div id="status"></div>

</div>

<script>

    // ==========================================
    // CLOUDINARY SETTINGS
    // ==========================================

    const cloudName = "aiv9r6zk";

    const uploadPreset = "event_photos";


    // ==========================================
    // CREATE CLOUDINARY UPLOAD WIDGET
    // ==========================================

    const widget = cloudinary.createUploadWidget(

        {
            cloudName: cloudName,

            uploadPreset: uploadPreset,

            sources: ["local"],

            multiple: false,

            maxFiles: 1,

            clientAllowedFormats: [
                "jpg",
                "jpeg",
                "png",
                "webp"
            ],

            maxFileSize: 10000000,

            showAdvancedOptions: false,

            cropping: false
        },

        function(error, result) {

            if (error) {

                console.error(error);

                document.getElementById("status").innerText =
                    "❌ Upload failed.";

                return;
            }


            if (result.event === "success") {

                console.log("Photo uploaded!");

                document.getElementById("status").innerText =
                    "✅ Photo uploaded successfully!";

            }

        }

    );


    // ==========================================
    // TAKE PHOTO BUTTON
    // ==========================================

    document
        .getElementById("cameraButton")
        .addEventListener("click", function() {

            widget.open();

        });

</script>

</body>
</html>
