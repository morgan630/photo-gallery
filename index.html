<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Photo Booth</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f5;
            color: #18181b;
            min-height: 100vh;
        }

        /* HEADER */

        .hero {
            background: #111111;
            color: white;
            padding: 45px 20px 55px;
            text-align: center;
        }

        .hero .small-title {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.65;
            margin-bottom: 12px;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 15px;
            color: #d4d4d8;
            line-height: 1.6;
            max-width: 400px;
            margin: auto;
        }

        /* MAIN */

        .container {
            max-width: 850px;
            margin: -30px auto 40px;
            padding: 0 16px;
        }

        /* CAMERA CARD */

        .camera-card {
            background: white;
            border-radius: 22px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .camera-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            background: #f1f1f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .camera-card h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .camera-card p {
            color: #71717a;
            font-size: 14px;
            margin-bottom: 22px;
        }

        /* BUTTON */

        .camera-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin: auto;
            padding: 17px 25px;
            background: #111111;
            color: white;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .camera-button:hover {
            background: #333333;
            transform: translateY(-2px);
        }

        .camera-button:active {
            transform: scale(0.98);
        }

        input[type="file"] {
            display: none;
        }

        /* STATUS */

        #status {
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
        }

        /* GALLERY HEADER */

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 35px 5px 15px;
        }

        .gallery-header h2 {
            font-size: 22px;
        }

        .gallery-header span {
            font-size: 13px;
            color: #71717a;
        }

        /* GALLERY */

        #gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .photo {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            background: #e4e4e7;
            transition: 0.2s;
        }

        .photo:hover {
            transform: scale(1.02);
        }

        /* FOOTER */

        footer {
            text-align: center;
            color: #a1a1aa;
            font-size: 12px;
            padding: 20px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .hero {
                padding: 38px 20px 50px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .camera-card {
                padding: 28px 18px;
            }

            #gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 7px;
            }

            .photo {
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- HERO -->

    <section class="hero">

        <div class="small-title">
            Welcome
        </div>

        <h1>Event Photo Booth</h1>

        <p>
            Capture the moment, share the memory,
            and see everyone's photos in one place.
        </p>

    </section>


    <!-- MAIN -->

    <main class="container">

        <!-- CAMERA -->

        <div class="camera-card">

            <div class="camera-icon">
                📸
            </div>

            <h2>Capture Your Moment</h2>

            <p>
                Take a photo and share it with everyone at the event.
            </p>

            <label class="camera-button" for="photoInput">
                📷 &nbsp; TAKE A PHOTO
            </label>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
                capture="environment"
            >

            <div id="status"></div>

        </div>


        <!-- GALLERY -->

        <div class="gallery-header">

            <h2>Event Gallery</h2>

            <span id="photoCount">
                Photos
            </span>

        </div>

        <div id="gallery"></div>

    </main>


    <footer>
        Made for unforgettable moments ✨
    </footer>


    <!-- JAVASCRIPT -->

    <script>

        /* CLOUDINARY SETTINGS */

        const CLOUD_NAME = "aiv9r6zk";
        const UPLOAD_PRESET = "Event Photo";


        /* ELEMENTS */

        const photoInput =
            document.getElementById("photoInput");

        const gallery =
            document.getElementById("gallery");

        const status =
            document.getElementById("status");

        const photoCount =
            document.getElementById("photoCount");


        let uploadedPhotos = 0;


        /* PHOTO UPLOAD */

        photoInput.addEventListener(
            "change",
            async function () {

                const file = this.files[0];

                if (!file) {
                    return;
                }


                status.textContent =
                    "Uploading your photo...";


                const formData =
                    new FormData();


                formData.append(
                    "file",
                    file
                );


                formData.append(
                    "upload_preset",
                    UPLOAD_PRESET
                );

                formData.append(
                    "tags",
                    "event_gallery"
                );


                try {

                    const response =
                        await fetch(
                            `https://api.cloudinary.com/v1_1/${aiv9r6zk}/image/upload`,
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    if (data.secure_url) {

                        addPhoto(
                            data.secure_url
                        );


                        uploadedPhotos++;


                        photoCount.textContent =
                            uploadedPhotos +
                            (uploadedPhotos === 1
                                ? " Photo"
                                : " Photos");


                        status.textContent =
                            "✓ Photo uploaded successfully!";


                        photoInput.value = "";


                    } else {

                        console.log(data);

                        status.textContent =
                            "Unable to upload the photo.";

                    }


                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "Something went wrong. Please try again.";

                }

            }
        );


        /* ADD PHOTO TO GALLERY */

        function addPhoto(url) {

            const image =
                document.createElement("img");


            image.src = url;

            image.className = "photo";

            image.loading = "lazy";


            gallery.prepend(image);

        }

    </script>

</body>
</html>
